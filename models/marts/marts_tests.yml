version: 2

models:
  - name: int_sales_enriched
    columns:
      - name: line_item_id
        data_tests:
          - not_null
          - unique
      - name: product_id
        data_tests:
          - relationships:
              arguments: # ✅ FIX: Moves field and to parameters into the proper arguments block
                to: ref('stg_products')
                field: product_id
              config:
                severity: warn

  - name: fct_sales_profitability
    columns:
      - name: line_item_id
        data_tests:
          - not_null
          - unique

  - name: fct_delivery_performance
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: delivery_variance_days
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                max_value: 21
              config:
                severity: warn

  - name: fct_customer_value
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: fct_customer_acquisition
    columns:
      - name: signup_month
        data_tests:
          - not_null

  - name: fct_product_performance
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - order_month

  - name: fct_inventory_risk
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: fct_commercial_risk
    columns:
      - name: line_item_id
        data_tests:
          - not_null
          - unique
