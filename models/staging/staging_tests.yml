version: 2

models:
  - name: stg_sales
    description: Cleaned sales data at sales-line grain.
    columns:
      - name: line_item_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: discount_applied
        data_tests:
          - range: 
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn

  - name: stg_products
    description: Cleaned product master.
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: stg_customers
    description: Cleaned customer master.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
